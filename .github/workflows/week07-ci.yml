# The code path: on every push and pull request that touches this lab, lint, run
# each test layer, then run the pipeline and the gate. Every step calls a make
# target, so the runner and a laptop run the same build.
# The job graph:
#
#   lint ─┐
#         ├─▶ pipeline ─▶ job summary and artifact
#   test ─┘   (matrix: unit, data, eval)
#
# Reference: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Week 7 CI

on:
  push:
    paths:
      - "labs/week-07-ci-workflow/starter/**"
      - ".github/workflows/week07-ci.yml"
  pull_request:
    paths:
      - "labs/week-07-ci-workflow/starter/**"
      - ".github/workflows/week07-ci.yml"

defaults:
  run:
    working-directory: labs/week-07-ci-workflow/starter

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Install the lint group
        run: uv sync --locked --group lint
      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: [unit, data, eval]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Install all groups
        run: uv sync --locked --all-groups
      - name: Run the ${{ matrix.layer }} tests
        run: make test-${{ matrix.layer }}

  pipeline:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Install all groups
        run: uv sync --locked --all-groups

      # The runner has no Silo, so it builds the DVC-tracked file from the
      # committed batches; the build is byte-identical to the pointer's MD5.
      - name: Rebuild the dataset
        run: make data-v2

      - name: validate -> prepare -> train -> evaluate -> gate
        run: make ci

      - name: Publish the gate verdict to the job summary
        if: always()
        run: make gate-summary >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate a NO-GO
        if: failure()
        run: echo "::error title=Model gate::The pipeline or the gate failed. Read the job summary and the uploaded reports/gate.json."

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: week07-ci-evidence
          path: |
            labs/week-07-ci-workflow/starter/metrics/
            labs/week-07-ci-workflow/starter/reports/
            labs/week-07-ci-workflow/starter/models/model.pkl
          if-no-files-found: warn
