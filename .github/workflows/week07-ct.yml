# The model path: retrain on a clock or by hand, with no code change, and stop at
# the gate. It runs the same make targets as ci.yml. It does not register, promote
# or deploy: the runner has no MLflow, and a release stays a human decision.
# Reference: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
name: Week 7 CT

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why retrain now?"
        required: true
        type: string
  schedule:
    # Every Monday at 02:00 UTC. GitHub may start it late, or skip it under load.
    - cron: "0 2 * * 1"

defaults:
  run:
    working-directory: labs/week-07-ci-workflow/starter

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Install all groups
        run: uv sync --locked --all-groups

      - name: Why this run happened
        env:
          REASON: ${{ inputs.reason || 'scheduled retrain' }}
        run: |
          echo "trigger: ${{ github.event_name }}"
          echo "reason:  $REASON"

      # The runner has no Silo, so it builds the DVC-tracked file from the
      # committed batches.
      - name: Rebuild the dataset
        run: make data-v2

      - name: retrain and gate
        run: make ct-local

      - name: Publish the gate verdict to the job summary
        if: always()
        run: make gate-summary >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate a NO-GO
        if: failure()
        run: echo "::error title=Model gate::The retrained model did not pass the gate. Read the job summary and the uploaded reports/gate.json."

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: week07-ct-evidence
          path: |
            labs/week-07-ci-workflow/starter/metrics/
            labs/week-07-ci-workflow/starter/reports/
            labs/week-07-ci-workflow/starter/models/model.pkl
          if-no-files-found: warn
