# Pipeline hyperparameters and release policy. DVC records these values in dvc.lock.
#
# `evaluation` is what we measure; `acceptance` is whether it passes.
# `evaluate` depends on `evaluation` and `gate` on `acceptance`, so a threshold
# change re-runs only `gate`, and a slice change re-runs `evaluate` and `gate`.

random_seed: 42

prepare:
  test_size: 0.25

train:
  family: logreg
  C: 1.0
  max_iter: 1000
  # How the model's imputer fills missing values: median, mean or most_frequent.
  impute_strategy: median
  # Used only when `family: rf` (Exercise 6).
  n_estimators: 100

# Slice definitions. Bins are left-closed, right-open: [21, 30) means 21 to 29.
# Slices are cut on the raw frame, before the imputer runs.
evaluation:
  slices:
    age_band:
      column: age
      kind: bins
      bins: [21, 30, 40, 50, .inf]
      labels: ["21-29", "30-39", "40-49", "50+"]

    bmi_band:
      column: bmi
      kind: bins
      bins: [0, 25, 30, .inf]
      labels: ["under_normal", "overweight", "obese"]
      # A bmi of 0 is a missing measurement, so it gets its own group.
      missing_label: "missing"

    insulin_missing:
      column: insulin
      kind: missing_flag
      labels: ["insulin_present", "insulin_missing"]

# The acceptance criteria: what "ready to ship" means.
acceptance:
  # Stamped onto the MLflow run. Change it whenever a threshold changes.
  criteria_version: "1.0.0"

  # Absolute floors. A constant "no diabetes" model scores accuracy 0.651 (the
  # negative rate) and F1 0, so both floors sit above it.
  minimum:
    accuracy: 0.70
    f1: 0.55
    roc_auc: 0.75

  # Against the champion in metrics/baseline.json. F1 is what we gate on; the
  # others are only reported.
  regression:
    primary_metric: f1
    max_drop: 0.01
    also_report: [accuracy, roc_auc]

  # A group needs 20 rows and 10 positives to be judged at all. A gated group
  # fails below F1 0.50 or more than 0.10 below the aggregate F1 (0.6341 - 0.50
  # = 0.134 > 0.10, so the gap rule can still fire above the floor).
  slice_rules:
    min_support: 20
    min_positives: 10
    min_f1: 0.50
    max_f1_gap: 0.10

  # Fairness gates, per axis; an axis left out (bmi_band) is only reported.
  # insulin_missing is a data-collection artefact, not a patient trait: the model
  # should act on and find cases equally in both groups (now 0.0070 and 0.1562).
  # age_band only gates the TPR gap, more loosely (now 0.2059): diabetes
  # prevalence really rises with age, so selection rates should differ, and the
  # groups are small, so the gap is noisy.
  fairness:
    insulin_missing:
      max_selection_rate_gap: 0.10
      max_tpr_gap: 0.20
    age_band:
      max_tpr_gap: 0.25
